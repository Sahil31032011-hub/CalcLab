<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CalcLab — All-in-One Calculator</title>
<style>
:root{--bg:#0d131b;--panel:#17212c;--panel2:#202d3a;--line:#314252;--txt:#edf4f7;--muted:#91a2b2;--lime:#b4ed79;--mint:#d8f6bc;--red:#ff958c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#263b2d 0,transparent 34%),var(--bg);color:var(--txt);font:15px system-ui,Arial;min-height:100vh}.app{max-width:1120px;margin:auto;padding:25px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:850;letter-spacing:-1px;color:var(--lime)}.sub{color:var(--muted);font-size:11px;letter-spacing:2px}.nav{display:none;flex-wrap:wrap;gap:8px;margin:14px 0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.nav.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));animation:menuPanelIn .32s cubic-bezier(.2,.8,.2,1) both}.nav.open button{animation:menuItemIn .38s cubic-bezier(.2,.8,.2,1) both}.nav.open button:nth-child(1){animation-delay:.025s}.nav.open button:nth-child(2){animation-delay:.05s}.nav.open button:nth-child(3){animation-delay:.075s}.nav.open button:nth-child(4){animation-delay:.1s}.nav.open button:nth-child(5){animation-delay:.125s}.nav.open button:nth-child(6){animation-delay:.15s}.nav.open button:nth-child(7){animation-delay:.175s}.nav.open button:nth-child(8){animation-delay:.2s}.nav.open button:nth-child(9){animation-delay:.225s}.nav.open button:nth-child(10){animation-delay:.25s}.nav.open button:nth-child(11){animation-delay:.275s}.nav.open button:nth-child(12){animation-delay:.3s}.menu-toggle{width:46px;height:42px;display:flex;flex-direction:column;justify-content:center;gap:5px;align-items:center}.menu-toggle span{display:block;width:20px;height:2px;background:var(--lime);border-radius:3px;transition:.2s}.menu-toggle.open span:first-child{transform:translateY(7px) rotate(45deg)}.menu-toggle.open span:nth-child(2){opacity:0}.menu-toggle.open span:last-child{transform:translateY(-7px) rotate(-45deg)}.menu-history{grid-column:1/-1}.nav button,.key,.btn,select,input{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--txt);padding:12px;font:inherit}.nav button{cursor:pointer;font-size:12px;transition:.2s}.nav button.active{background:#2c402d;color:var(--lime);border-color:#6b9654}.nav button:hover,.key:hover,.btn:hover{transform:translateY(-2px);border-color:var(--lime);filter:brightness(1.12)}.panel{background:linear-gradient(145deg,#1b2733,#141d27);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 55px #0004;animation:rise .35s ease both}.columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr);gap:16px}.display{background:#091018;border:1px solid #2a3b49;border-radius:13px;padding:18px;margin:15px 0;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}.expr{min-height:22px;color:var(--muted);font:14px ui-monospace,monospace;overflow-wrap:anywhere}.result{font:clamp(27px,5vw,39px) ui-monospace,monospace;text-align:right;overflow-wrap:anywhere;transition:transform .18s,color .18s}.result.pop{animation:pop .25s ease}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.key{cursor:pointer;min-height:54px;font:17px ui-monospace,monospace;transition:transform .13s,border-color .13s,background .13s}.key.op{color:var(--lime);background:#26352e}.key.eq,.primary{background:var(--lime);color:#162212;border-color:var(--lime);font-weight:800}.key.danger{color:var(--red)}.key:active,.btn:active{transform:scale(.96)}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;background:#0d151e;outline:none}input:focus,select:focus{border-color:var(--lime);box-shadow:0 0 0 3px #b4ed791c}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{cursor:pointer}.output{margin-top:16px;padding:17px;border-radius:12px;background:#101b19;border:1px solid #405c40;animation:rise .25s ease}.output strong{display:block;color:var(--lime);font:25px ui-monospace,monospace;margin-top:7px;overflow-wrap:anywhere}.muted{font-size:12px;color:var(--muted);line-height:1.6}.history{margin-top:15px;max-height:155px;overflow:auto}.history div{padding:8px 2px;border-bottom:1px solid var(--line);font:12px ui-monospace,monospace;color:var(--muted)}.span2{grid-column:span 2}.kbd{display:inline-block;border:1px solid #506171;border-radius:5px;padding:2px 6px;font:11px ui-monospace,monospace;color:var(--mint)}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--lime);color:#14200e;padding:10px 15px;border-radius:9px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes menuPanelIn{from{opacity:0;transform:translateY(-12px) scale(.98);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:translateY(0) scale(1);clip-path:inset(0 0 0 0)}}@keyframes menuItemIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes pop{50%{transform:scale(1.035);color:var(--lime)}}.loading-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(8,14,20,.96);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease}.loading-screen.active{opacity:1;visibility:visible}.loader-ring{width:58px;height:58px;border:4px solid #314252;border-top-color:var(--lime);border-right-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 28px #b4ed7930}.loader-title{font-weight:750;letter-spacing:.4px;color:var(--txt)}.loader-caption{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.loader-dots:after{content:'';display:inline-block;width:18px;text-align:left;animation:dots 1.1s steps(4,end) infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}@media(max-width:720px){.app{padding:14px}.columns{grid-template-columns:1fr}.nav.open{grid-template-columns:repeat(2,minmax(0,1fr));margin:12px 0}.nav button{padding:10px}.panel{padding:15px}.key{min-height:49px}.row{grid-template-columns:1fr}}body[data-theme="light"]{--bg:#edf2f7;--panel:#ffffff;--panel2:#e7edf3;--line:#cbd5df;--txt:#182431;--muted:#5e6d7b;--lime:#548b22;--mint:#345c19;--red:#c43d35;background:var(--bg);color:var(--txt)}body[data-theme="light"] .panel{background:linear-gradient(145deg,#fff,#f3f6f9);box-shadow:0 16px 38px #18243112}body[data-theme="light"] .display{background:#f4f7fa;border-color:#cbd5df}body[data-theme="light"] input,body[data-theme="light"] select{background:#fff;color:#182431}body[data-theme="light"] .key.op{background:#e5efdd;color:#416d1b}body[data-theme="light"] .output{background:#f0f7e9;border-color:#c9ddb8}body[data-theme="light"] .loading-screen{background:rgba(239,244,248,.96)}body[data-bg="default"]{background:radial-gradient(ellipse at 75% 0%,#263b2d 0,transparent 34%),var(--bg)}body[data-bg="plain"]{background:var(--bg)}body[data-bg="ocean"]{background:radial-gradient(ellipse at 15% 0%,#174e68 0,transparent 42%),radial-gradient(ellipse at 90% 100%,#1b365e 0,transparent 45%),var(--bg)}body[data-bg="sunset"]{background:radial-gradient(ellipse at 80% 0%,#70443c 0,transparent 42%),radial-gradient(ellipse at 10% 100%,#59416e 0,transparent 45%),var(--bg)}body[data-bg="forest"]{background:radial-gradient(ellipse at 70% 0%,#31553b 0,transparent 40%),radial-gradient(ellipse at 0% 100%,#263f32 0,transparent 45%),var(--bg)}body[data-motion="off"] *,body[data-motion="off"] *:before,body[data-motion="off"] *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}body[data-motion="reduced"] *,body[data-motion="reduced"] *:before,body[data-motion="reduced"] *:after{animation-duration:.16s!important;transition-duration:.16s!important}@keyframes creditRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes creditShine{0%{background-position:180% center}100%{background-position:-180% center}}.built-credit{margin:30px auto 8px;text-align:center;font-size:13px;font-weight:750;letter-spacing:2px;background:linear-gradient(100deg,var(--muted) 15%,var(--mint) 35%,#fff 50%,var(--lime) 65%,var(--muted) 85%);background-size:220% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:creditRise .8s ease both,creditShine 3.5s linear infinite;filter:drop-shadow(0 0 7px #b4ed7955)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="app"><header class="head"><div><div class="brand">∑ CalcLab</div><div class="sub">YOUR ALL-IN-ONE CALCULATION SPACE</div></div><button id="historyBtn" hidden></button><button class="btn menu-toggle" id="menuToggle" aria-label="Open calculator menu" aria-expanded="false"><span></span><span></span><span></span></button></header><nav class="nav" id="nav"><button class="menu-history" id="menuHistory">Calculation history ↶</button></nav><main id="work"></main><p class="muted">Keyboard: digits and operators · Enter = calculate · Backspace = delete · Esc = clear</p><footer class="built-credit">BUILT BY SAHIL</footer></div><div class="toast" id="toast"></div><div class="loading-screen active" id="loadingScreen" role="status" aria-live="polite"><div class="loader-ring"></div><div class="loader-title" id="loadingTitle">Starting CalcLab</div><div class="loader-caption loader-dots" id="loadingCaption">Preparing your calculator</div></div>
<script>
const $=s=>document.querySelector(s);
const names={basic:'Basic',scientific:'Scientific',percentage:'Percentage',finance:'Finance',converter:'Converter',date:'Date & time',programmer:'Programmer',bmi:'BMI',everyday:'Everyday',maths:'Maths tools',geometry:'Geometry',statistics:'Statistics',settings:'Settings ⚙'};
let mode='basic',expr='',last=0,memory=0,memories=[0,0,0,0,0],history=[],justDone=false;try{history=JSON.parse(localStorage.getItem('calclab-history')||'[]');memories=JSON.parse(localStorage.getItem('calclab-memories')||'[0,0,0,0,0]');memory=memories[0]||0}catch(e){}
const fmt=n=>{if(!Number.isFinite(n))throw Error('Result is not a finite number');return Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:10})};
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function showLoading(title,caption){$('#loadingTitle').textContent=title;$('#loadingCaption').textContent=caption;$('#loadingScreen').classList.add('active')}
function hideLoading(){const screen=$('#loadingScreen');screen.classList.remove('active')}
function save(s){history.unshift(s);history=history.slice(0,100);try{localStorage.setItem('calclab-history',JSON.stringify(history))}catch(e){}}
function showOut(v,n=''){let o=$('#out');o.innerHTML='<span class="muted">RESULT</span><strong>'+v+'</strong><p class="muted">'+n+'</p>';o.animate([{opacity:.3,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:240});save(v+' '+n)}
function nav(){let n=$('#nav');n.innerHTML=Object.keys(names).map(k=>'<button data-mode="'+k+'" class="'+(k===mode?'active':'')+'">'+names[k]+'</button>').join('')+'<button class="menu-history" id="menuHistory">Calculation history ↶</button>';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const selected=b.dataset.mode;n.classList.remove('open');$('#menuToggle').classList.remove('open');$('#menuToggle').setAttribute('aria-expanded','false');showLoading('Opening '+names[selected],'Loading calculator tools');setTimeout(()=>{mode=selected;render();hideLoading()},480)});$('#menuHistory').onclick=()=>alert(history.length?history.join('\n'):'No calculations yet')}
function basic(){return '<div class="columns"><section class="panel"><h2>Standard calculator</h2><div class="display"><div id="expr" class="expr">'+escapeHtml(expr)+'</div><div id="res" class="result">0</div></div><div class="keys">'+['AC','DEL','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(k=>'<button class="key '+('÷×−+'.includes(k)?'op ':'')+(k==='='?'eq ':'')+(k==='AC'?'danger':'')+'" data-key="'+k+'">'+k+'</button>').join('')+'</div><p class="muted">M = <b id="mem">'+fmt(memory)+'</b> <button class="btn" id="mplus">M+</button> <button class="btn" id="mminus">M−</button> <button class="btn" id="mr">MR</button> <button class="btn" id="mc">MC</button></p><div class="row"><div class="field"><label>Memory slot</label><select id="memslot"><option value="0">M1</option><option value="1">M2</option><option value="2">M3</option><option value="3">M4</option><option value="4">M5</option></select></div><div class="field"><label>Saved memory</label><div><button class="btn" id="msave">Store result</button> <button class="btn" id="mrecall">Recall</button> <button class="btn" id="mclear">Clear</button></div></div></div><p class="muted" id="memslots">'+memories.map((v,i)=>'M'+(i+1)+': '+fmt(v)).join(' · ')+'</p><div class="history" id="recent">'+history.slice(0,5).map(x=>'<div>'+escapeHtml(x)+'</div>').join('')+'</div></section><section class="panel"><h3>Keyboard controls</h3><p class="muted"><span class="kbd">0–9</span> numbers<br><span class="kbd">+ − * /</span> operators<br><span class="kbd">Enter</span> calculate<br><span class="kbd">Backspace</span> delete one character<br><span class="kbd">Esc</span> clear<br><span class="kbd">( )</span> brackets<br><span class="kbd">.</span> decimal point</p><p class="muted">You can type directly on your physical keyboard or click the calculator buttons. Use × or * for multiplication and ÷ or / for division.</p></section></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function calcExpression(input){let s=input.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'');let tokens=s.match(/(?:\d+\.?\d*|\.\d+)|(?:[A-Za-z]+)|[()+\-*/%^!]/g)||[];let joined=tokens.join('');if(joined!==s.replace(/\s+/g,''))throw Error('Please check the expression');let i=0;function primary(){let t=tokens[i++];if(t===undefined)throw Error('Expression is incomplete');if(t==='+'||t==='-'){let v=primary();return t==='-'?-v:v}if(t==='('){let v=add();if(tokens[i++]!==')')throw Error('Missing closing bracket');return v}if(/^\d|^\./.test(t))return Number(t);let fn=t.toLowerCase();if(['pi','e'].includes(fn))return fn==='pi'?Math.PI:Math.E;if(['sin','cos','tan','sqrt','log','ln','abs','floor','ceil','round'].includes(fn)){if(tokens[i++]!=='(')throw Error(fn+' needs parentheses');let v=add();if(tokens[i++]!==')')throw Error('Missing closing bracket');if(fn==='sin')return Math.sin(v*Math.PI/180);if(fn==='cos')return Math.cos(v*Math.PI/180);if(fn==='tan')return Math.tan(v*Math.PI/180);if(fn==='sqrt')return Math.sqrt(v);if(fn==='log')return Math.log10(v);if(fn==='ln')return Math.log(v);if(fn==='abs')return Math.abs(v);if(fn==='floor')return Math.floor(v);if(fn==='ceil')return Math.ceil(v);return Math.round(v)}throw Error('Unknown function or symbol: '+t)}function power(){let v=primary();if(tokens[i]==='!'){i++;let n=Math.round(v);if(n<0||n>170||n!==v)throw Error('Factorial needs a whole number from 0 to 170');v=1;for(let j=2;j<=n;j++)v*=j}if(tokens[i]==='^'){i++;v=Math.pow(v,power())}return v}function mul(){let v=power();while(['*','/','%'].includes(tokens[i])){let op=tokens[i++],b=power();v=op==='*'?v*b:op==='/'?v/b:v%b}return v}function add(){let v=mul();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++],b=mul();v=op==='+'?v+b:v-b}return v}let result=add();if(i!==tokens.length)throw Error('Unexpected input near '+tokens[i]);if(!Number.isFinite(result))throw Error('Cannot divide by zero or calculate this value');return result}
function key(k){if(k==='AC'){expr='';justDone=false;$('#res').textContent='0'}else if(k==='DEL'){expr=expr.slice(0,-1);justDone=false}else if(k==='='){try{last=calcExpression(expr);$('#res').textContent=fmt(last);save(expr+' = '+fmt(last));expr='';justDone=true;updateRecent();$('#res').classList.remove('pop');void $('#res').offsetWidth;$('#res').classList.add('pop')}catch(e){$('#res').textContent=e.message;toast(e.message)}return}else if(k==='±'){expr=expr?'-('+expr+')':'-';justDone=false}else{if(justDone&&/[0-9.(]/.test(k))expr='';expr+=k;justDone=false}$('#expr').textContent=expr;$('#res').textContent=expr||'0'}
function persistMem(){try{localStorage.setItem('calclab-memories',JSON.stringify(memories))}catch(e){}}function updateRecent(){if($('#recent'))$('#recent').innerHTML=history.slice(0,8).map(x=>'<div>'+escapeHtml(x)+'</div>').join('')}
function render(){nav();let h='';if(mode==='basic')h=basic();else if(mode==='scientific')h=scientific();else if(mode==='percentage')h=percentage();else if(mode==='finance')h=finance();else if(mode==='converter')h=converter();else if(mode==='date')h=dateTool();else if(mode==='programmer')h=programmer();else if(mode==='bmi')h=bmi();else if(mode==='everyday')h=everyday();else if(mode==='maths')h=mathsTools();else if(mode==='geometry')h=geometry();else if(mode==='settings')h=settings();else h=statistics();$('#work').innerHTML=h;wire()}
function scientific(){return '<section class="panel"><h2>Scientific calculator</h2><p class="muted">Use degrees for trigonometry. Examples: sin(30), sqrt(81), log(100), 5!, pi*2, (4+3)^2</p><div class="field"><label>Expression</label><input id="sci" value="sin(30)+sqrt(81)+log(100)"></div><button class="btn primary" id="sciGo">Calculate</button><div id="out" class="output"><span class="muted">RESULT</span><strong>—</strong></div></section>'}
function percentage(){return '<section class="panel"><h2>Percentage tools</h2><div class="field"><label>Calculation type</label><select id="ptype"><option value="of">X% of Y</option><option value="change">Percentage change from X to Y</option><option value="what">X is what % of Y?</option><option value="add">Add X% to Y</option><option value="sub">Subtract X% from Y</option></select></div><div class="row"><div class="field"><label>X / percentage</label><input id="pa" type="number" value="15"></div><div class="field"><label>Y / number</label><input id="pb" type="number" value="240"></div></div><button class="btn primary" id="pctGo">Calculate</button><div id="out" class="output">Result<strong>—</strong></div></section>'}
function finance(){return '<section class="panel"><h2>Finance calculator</h2><div class="field"><label>Choose a finance tool</label><select id="ft"><option value="ci">Compound interest</option><option value="si">Simple interest</option><option value="emi">Loan EMI</option><option value="fd">Fixed deposit (FD) maturity</option><option value="sip">SIP future value</option><option value="rd">Recurring deposit estimate</option><option value="inflation">Inflation / future purchasing power</option></select></div><div class="row"><div class="field"><label>Principal / monthly investment (₹)</label><input id="fp" type="number" value="100000"></div><div class="field"><label>Annual interest / inflation rate (%)</label><input id="fr" type="number" value="8"></div><div class="field"><label>Time (years)</label><input id="fy" type="number" value="5"></div><div class="field"><label>Compounds per year</label><select id="fn"><option value="1">Yearly</option><option value="2">Half-yearly</option><option value="4">Quarterly</option><option value="12">Monthly</option></select></div></div><button class="btn primary" id="finGo">Calculate</button><div id="out" class="output">Result<strong>—</strong></div><p class="muted">SIP/RD results are estimates using a fixed monthly rate and regular month-end deposits. Actual bank, tax and market returns may differ.</p></section>'}
const units={Length:{Meter:1,Kilometer:1000,Centimeter:.01,Millimeter:.001,Mile:1609.344,Foot:.3048,Inch:.0254},Mass:{Kilogram:1,Gram:.001,Milligram:.000001,Pound:.45359237,Ounce:.0283495,Tonne:1000},Time:{Second:1,Minute:60,Hour:3600,Day:86400},Area:{'Square meter':1,'Square kilometer':1e6,'Square foot':.092903,'Acre':4046.856},Volume:{Liter:1,Milliliter:.001,'Cubic meter':1000,'US gallon':3.78541},Speed:{'m/s':1,'km/h':.277778,mph:.44704}};
function converter(){return '<section class="panel"><h2>Unit converter</h2><div class="field"><label>Category</label><select id="cat">'+Object.keys(units).concat('Temperature').map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="row"><div class="field"><label>From</label><select id="from"></select></div><div class="field"><label>To</label><select id="to"></select></div></div><div class="field"><label>Value</label><input id="cv" type="number" value="1"></div><button class="btn primary" id="convGo">Convert</button><div id="out" class="output">Result<strong>—</strong></div></section>'}
function dateTool(){return '<section class="panel"><h2>Date calculator</h2><div class="field"><label>Mode</label><select id="dm"><option value="diff">Days between dates</option><option value="add">Add or subtract days</option></select></div><div class="field"><label>Start date</label><input id="d1" type="date"></div><div class="field" id="endWrap"><label>End date</label><input id="d2" type="date"></div><div class="field" id="daysWrap" style="display:none"><label>Days to add (negative to subtract)</label><input id="days" type="number" value="30"></div><button class="btn primary" id="dateGo">Calculate</button><div id="out" class="output">Result<strong>—</strong></div></section>'}
function programmer(){return '<section class="panel"><h2>Programmer calculator</h2><div class="field"><label>Decimal integer</label><input id="num" type="number" step="1" value="255"></div><button class="btn primary" id="baseGo">Convert bases</button><div id="out" class="output">Representations<strong>—</strong></div><div class="field"><label>Bitwise operation</label><select id="bit"><option>AND</option><option>OR</option><option>XOR</option><option>NOT</option><option>Left shift</option><option>Right shift</option></select></div><div class="row"><div class="field"><label>Second integer / shift count</label><input id="num2" type="number" value="1"></div><div class="field" style="align-content:end"><button class="btn" id="bitGo">Run operation</button></div></div><div id="bitout" class="output">—</div></section>'}
function bmi(){return '<section class="panel"><h2>BMI calculator</h2><div class="field"><label>Units</label><select id="unit"><option value="metric">Metric (kg / cm)</option><option value="imperial">Imperial (lb / inches)</option></select></div><div class="row"><div class="field"><label>Weight</label><input id="weight" type="number" value="60"></div><div class="field"><label>Height</label><input id="height" type="number" value="165"></div></div><button class="btn primary" id="bmiGo">Calculate BMI</button><div id="out" class="output">Your BMI<strong>—</strong></div><p class="muted">BMI is a screening measure, not a diagnosis. For children and teens, age- and sex-specific percentiles are needed; adult categories do not apply.</p></section>'}
function everyday(){return '<section class="panel"><h2>Everyday money tools</h2><div class="field"><label>Tool</label><select id="evtype"><option value="discount">Discount / sale price</option><option value="gst">GST / tax</option><option value="tip">Tip calculator</option><option value="split">Split a bill</option><option value="unitprice">Unit price comparison</option></select></div><div class="row"><div class="field"><label>Amount / price A</label><input id="eva" type="number" value="1000"></div><div class="field"><label>Percent / number B</label><input id="evb" type="number" value="18"></div><div class="field"><label>People / quantity C</label><input id="evc" type="number" value="4"></div></div><button class="btn primary" id="evGo">Calculate</button><div id="out" class="output">Result<strong>—</strong></div><p class="muted">Discount gives the final sale price; GST adds tax; tip and bill split show per-person totals.</p></section>'}
function mathsTools(){return '<section class="panel"><h2>Maths toolbox</h2><div class="field"><label>Choose a tool</label><select id="mtype"><option value="average">Average of numbers</option><option value="gcd">HCF / GCD and LCM</option><option value="linear">Solve ax + b = c</option><option value="quadratic">Quadratic equation ax² + bx + c = 0</option><option value="fraction">Fraction calculator (a/b op c/d)</option><option value="ratio">Simplify ratio A : B</option></select></div><div class="field"><label>Numbers (comma-separated for average)</label><input id="ma" value="12, 18, 24, 30"></div><div class="row"><div class="field"><label>Value B</label><input id="mb" type="number" value="2"></div><div class="field"><label>Value C</label><input id="mc2" type="number" value="3"></div></div><button class="btn primary" id="mathGo">Solve</button><div id="out" class="output">Result<strong>—</strong></div><p class="muted">Linear: enter a,b,c. Quadratic: enter a,b,c. Fraction: enter a/b in A and c/d in B/C as a,b,c,d separated by commas.</p></section>'}
function geometry(){return '<section class="panel"><h2>Geometry calculator</h2><div class="field"><label>Shape</label><select id="gshape"><option value="rect">Rectangle</option><option value="square">Square</option><option value="circle">Circle</option><option value="triangle">Triangle (base & height)</option><option value="cube">Cube</option><option value="cylinder">Cylinder</option></select></div><div class="row"><div class="field"><label>Length / radius / side / base</label><input id="ga" type="number" value="10"></div><div class="field"><label>Width / height</label><input id="gb" type="number" value="5"></div></div><button class="btn primary" id="geoGo">Calculate</button><div id="out" class="output">Result<strong>—</strong></div><p class="muted">Calculates area and perimeter for 2D shapes, or surface area and volume for 3D shapes. Cylinder uses radius and height.</p></section>'}
function statistics(){return '<section class="panel"><h2>Statistics calculator</h2><div class="field"><label>Enter data values separated by commas</label><textarea id="statsdata" rows="4">4, 7, 7, 9, 12, 15</textarea></div><button class="btn primary" id="statsGo">Analyse data</button><div id="out" class="output">Statistics<strong>—</strong></div><p class="muted">Finds count, sum, mean, median, mode, minimum, maximum, range and population standard deviation.</p></section>'}
function settings(){return '<section class="panel"><h2>Settings ⚙</h2><p class="muted">Customize the look and motion of every calculator. Your choices are saved on this device.</p><div class="field"><label>Theme</label><select id="setTheme"><option value="dark">Dark mode</option><option value="light">Light mode</option><option value="system">Follow device setting</option></select></div><div class="field"><label>Background style</label><select id="setBg"><option value="default">CalcLab default gradient</option><option value="plain">Plain background</option><option value="ocean">Ocean blue</option><option value="forest">Forest green</option><option value="sunset">Sunset purple</option></select></div><div class="field"><label>Animations</label><select id="setMotion"><option value="full">Full animations</option><option value="reduced">Reduced / faster animations</option><option value="off">Turn animations off</option></select></div><div class="output"><strong>Live preview</strong><p class="muted">Change any setting above to preview it instantly. Settings are remembered when you reopen CalcLab.</p><button class="btn" id="resetSettings">Reset to default settings</button></div></section>'}
function applySettings(){let s={theme:'dark',bg:'default',motion:'full'};try{s={...s,...JSON.parse(localStorage.getItem('calclab-settings')||'{}')}}catch(e){}let theme=s.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):s.theme;document.body.dataset.theme=theme;document.body.dataset.bg=s.bg;document.body.dataset.motion=s.motion;return s}
function saveSettings(){let s={theme:$('#setTheme').value,bg:$('#setBg').value,motion:$('#setMotion').value};try{localStorage.setItem('calclab-settings',JSON.stringify(s))}catch(e){}applySettings();toast('Settings saved')}
function wire(){
if($('#setTheme')){let s={theme:'dark',bg:'default',motion:'full'};try{s={...s,...JSON.parse(localStorage.getItem('calclab-settings')||'{}')}}catch(e){}$('#setTheme').value=s.theme;$('#setBg').value=s.bg;$('#setMotion').value=s.motion;['setTheme','setBg','setMotion'].forEach(id=>$('#'+id).onchange=saveSettings);$('#resetSettings').onclick=()=>{try{localStorage.removeItem('calclab-settings')}catch(e){}applySettings();$('#setTheme').value='dark';$('#setBg').value='default';$('#setMotion').value='full';toast('Default settings restored')}}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));
if($('#mplus'))$('#mplus').onclick=()=>{$('#mem').textContent=fmt(memory+=last);memories[0]=memory;persistMem();toast('Added to memory')};
if($('#mminus'))$('#mminus').onclick=()=>{$('#mem').textContent=fmt(memory-=last);memories[0]=memory;persistMem();toast('Subtracted from memory')};
if($('#mr'))$('#mr').onclick=()=>{expr+=String(memory);$('#expr').textContent=expr};
if($('#mc'))$('#mc').onclick=()=>{$('#mem').textContent=fmt(memory=0);memories[0]=0;persistMem()};if($('#msave'))$('#msave').onclick=()=>{let i=+$('#memslot').value;memories[i]=last;persistMem();$('#memslots').textContent=memories.map((v,j)=>'M'+(j+1)+': '+fmt(v)).join(' · ');toast('Stored in M'+(i+1))};if($('#mrecall'))$('#mrecall').onclick=()=>{let v=memories[+$('#memslot').value];expr+=String(v);$('#expr').textContent=expr;$('#res').textContent=expr};if($('#mclear'))$('#mclear').onclick=()=>{let i=+$('#memslot').value;memories[i]=0;persistMem();$('#memslots').textContent=memories.map((v,j)=>'M'+(j+1)+': '+fmt(v)).join(' · ');toast('Memory slot cleared')};
if($('#sciGo'))$('#sciGo').onclick=()=>{try{let v=calcExpression($('#sci').value);showOut(fmt(v))}catch(e){showOut('Error',e.message)}};
if($('#pctGo'))$('#pctGo').onclick=()=>{let a=+$('#pa').value,b=+$('#pb').value,t=$('#ptype').value;if(!Number.isFinite(a)||!Number.isFinite(b))return showOut('Error','Enter valid numbers');let v=t==='of'?a*b/100:t==='change'?(b-a)/a*100:t==='what'?a/b*100:t==='add'?b*(1+a/100):b*(1-a/100);if(!Number.isFinite(v))return showOut('Error','Cannot divide by zero');showOut(fmt(v)+(t==='change'||t==='what'?'%':''))};
if($('#finGo'))$('#finGo').onclick=()=>{let p=+$('#fp').value,r=+$('#fr').value/100,y=+$('#fy').value,n=+$('#fn').value,t=$('#ft').value;if(p<0||r<0||y<=0)return showOut('Error','Use non-negative amount and rate, and positive time');let months=Math.round(y*12),monthly=r/12,v,detail='';if(t==='emi'){v=monthly===0?p/months:p*monthly/(1-Math.pow(1+monthly,-months));detail='Monthly EMI · Total repayment ₹'+fmt(v*months)+' · Interest ₹'+fmt(v*months-p)}else if(t==='si'){v=p*(1+r*y);detail='Simple interest earned: ₹'+fmt(v-p)}else if(t==='sip'||t==='rd'){v=monthly===0?p*months:p*((Math.pow(1+monthly,months)-1)/monthly);detail='Total invested ₹'+fmt(p*months)+' · Estimated gain ₹'+fmt(v-p*months)}else if(t==='inflation'){v=p/Math.pow(1+r,y);detail='Estimated purchasing power after '+y+' years'}else{v=t==='si'?p*(1+r*y):p*Math.pow(1+r/n,n*y);detail=(t==='fd'?'FD maturity value':'Maturity amount')+' · Estimated interest ₹'+fmt(v-p)}showOut('₹'+fmt(v),detail)};
if($('#cat')){function fill(){let c=$('#cat').value,o=c==='Temperature'?['Celsius','Fahrenheit','Kelvin']:Object.keys(units[c]);['from','to'].forEach(id=>$('#'+id).innerHTML=o.map(x=>'<option>'+x+'</option>').join(''))}fill();$('#cat').onchange=fill;$('#convGo').onclick=()=>{let c=$('#cat').value,a=$('#from').value,b=$('#to').value,x=+$('#cv').value,v;if(c==='Temperature'){let C=a==='Celsius'?x:a==='Fahrenheit'?(x-32)*5/9:x-273.15;v=b==='Celsius'?C:b==='Fahrenheit'?C*9/5+32:C+273.15}else v=x*units[c][a]/units[c][b];showOut(fmt(v)+' '+b)}}
if($('#dm')){$('#d1').value=new Date().toISOString().slice(0,10);$('#d2').value=$('#d1').value;$('#dm').onchange=()=>{$('#endWrap').style.display=$('#dm').value==='add'?'none':'grid';$('#daysWrap').style.display=$('#dm').value==='add'?'grid':'none'};$('#dateGo').onclick=()=>{let d=new Date($('#d1').value+'T00:00:00');if(isNaN(d))return showOut('Error','Choose a valid date');if($('#dm').value==='add'){d.setDate(d.getDate()+Number($('#days').value));showOut(d.toLocaleDateString())}else{let e=new Date($('#d2').value+'T00:00:00');showOut(Math.round((e-d)/86400000)+' days')}}}
if($('#baseGo'))$('#baseGo').onclick=()=>{let n=Number($('#num').value);if(!Number.isSafeInteger(n))return showOut('Error','Enter a safe whole number');$('#out').innerHTML='<span class="muted">BINARY</span><strong>'+n.toString(2)+'</strong><p class="muted">OCTAL '+n.toString(8)+' · HEX '+n.toString(16).toUpperCase()+'</p>'};
if($('#bitGo'))$('#bitGo').onclick=()=>{let a=Number($('#num').value)|0,b=Number($('#num2').value)|0,o=$('#bit').value,v=o==='AND'?a&b:o==='OR'?a|b:o==='XOR'?a^b:o==='NOT'?~a:o==='Left shift'?a<<b:a>>b;$('#bitout').textContent=v+' · binary '+v.toString(2)};
if($('#bmiGo'))$('#bmiGo').onclick=()=>{let w=+$('#weight').value,h=+$('#height').value;if($('#unit').value==='imperial'){w*=.45359237;h*=.0254}else h/=100;if(w<=0||h<=0)return showOut('Error','Enter positive height and weight');let v=w/(h*h);showOut(fmt(v),'Adult reference categories are not appropriate for children and teens.')};if($('#evGo'))$('#evGo').onclick=()=>{let a=+$('#eva').value,b=+$('#evb').value,c=+$('#evc').value,t=$('#evtype').value;if(t==='discount')showOut('₹'+fmt(a*(1-b/100)),'Saved ₹'+fmt(a*b/100));else if(t==='gst'||t==='tip')showOut('₹'+fmt(a*(1+b/100)),'Added: ₹'+fmt(a*b/100));else if(t==='split')showOut('₹'+fmt(a/c)+' per person','Total ₹'+fmt(a));else if(b>0&&c>0)showOut('A/unit '+fmt(a/b)+' · B/unit '+fmt(c/b));else showOut('Error','Enter positive quantities')};
if($('#mathGo'))$('#mathGo').onclick=()=>{let t=$('#mtype').value,v=$('#ma').value.split(',').map(Number),a=v[0],b=v[1],c=v[2];if(v.some(x=>!Number.isFinite(x)))return showOut('Error','Check your numbers');if(t==='average')showOut(fmt(v.reduce((x,y)=>x+y,0)/v.length),'Count '+v.length+' · Sum '+fmt(v.reduce((x,y)=>x+y,0)));else if(t==='linear')showOut('x = '+fmt((c-b)/a),'Solution of ax + b = c');else if(t==='quadratic'){let d=b*b-4*a*c;showOut(d<0?'No real roots':'x₁ '+fmt((-b+Math.sqrt(d))/(2*a))+' · x₂ '+fmt((-b-Math.sqrt(d))/(2*a)),'Discriminant '+fmt(d))}else if(t==='fraction'){let [n1,d1,n2,d2]=v;let n=n1*d2+n2*d1,d=d1*d2,g=(x,y)=>y?g(y,x%y):Math.abs(x);if(!d1||!d2)return showOut('Error','Denominator cannot be zero');let z=g(n,d);showOut((n/z)+'/'+(d/z))}else{let x=Math.abs(a),y=Math.abs(b);while(y)[x,y]=[y,x%y];let g=x||1;showOut(t==='gcd'?'HCF '+g+' · LCM '+(a&&b?Math.abs(a*b/g):0):(a/g)+' : '+(b/g),'Simplified')}}; 
if($('#geoGo'))$('#geoGo').onclick=()=>{let s=$('#gshape').value,a=+$('#ga').value,b=+$('#gb').value;if(a<=0||b<0)return showOut('Error','Enter positive dimensions');if(s==='rect')showOut('Area '+fmt(a*b)+' · Perimeter '+fmt(2*(a+b)));else if(s==='square')showOut('Area '+fmt(a*a)+' · Perimeter '+fmt(4*a));else if(s==='circle')showOut('Area '+fmt(Math.PI*a*a)+' · Circumference '+fmt(2*Math.PI*a));else if(s==='triangle')showOut('Area '+fmt(a*b/2));else if(s==='cube')showOut('Volume '+fmt(a**3)+' · Surface area '+fmt(6*a*a));else showOut('Volume '+fmt(Math.PI*a*a*b)+' · Surface area '+fmt(2*Math.PI*a*(a+b)))};
if($('#statsGo'))$('#statsGo').onclick=()=>{let a=$('#statsdata').value.split(/[ ,;]+/).map(Number).filter(Number.isFinite);if(!a.length)return showOut('Error','Enter numbers');let s=[...a].sort((x,y)=>x-y),sum=a.reduce((x,y)=>x+y,0),m=s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2,counts={};a.forEach(x=>counts[x]=(counts[x]||0)+1);let top=Math.max(...Object.values(counts)),modeVal=Object.keys(counts).filter(x=>counts[x]===top).join(', '),sd=Math.sqrt(a.reduce((z,x)=>z+(x-sum/a.length)**2,0)/a.length);showOut('Mean '+fmt(sum/a.length)+' · Median '+fmt(m)+' · Mode '+modeVal,'Count '+a.length+' · Sum '+sum+' · Range '+fmt(s.at(-1)-s[0])+' · SD '+fmt(sd))};
}
$('#historyBtn').onclick=()=>alert(history.length?history.join('\n'):'No calculations yet');
document.addEventListener('keydown',e=>{if(mode!=='basic')return;let tag=document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;if(/^[0-9]$/.test(e.key)||['+','-','*','/','%','.','(',')','^','!'].includes(e.key)){e.preventDefault();key(e.key==='*'?'×':e.key==='/ ' ? '÷':e.key)}else if(e.key==='Enter'||e.key==='='){e.preventDefault();key('=')}else if(e.key==='Backspace'){e.preventDefault();key('DEL')}else if(e.key==='Escape'){e.preventDefault();key('AC')}});
$('#menuToggle').onclick=()=>{let open=$('#nav').classList.toggle('open');$('#menuToggle').classList.toggle('open',open);$('#menuToggle').setAttribute('aria-expanded',String(open))};applySettings();showLoading('Starting CalcLab','Preparing your calculator');render();setTimeout(hideLoading,850);
</script></body></html>
